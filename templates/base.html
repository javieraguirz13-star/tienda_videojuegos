{% load static %}
<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Tienda de Videojuegos{% endblock %}</title>

    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Scripts -->
    <script src="{% static 'js/script.js' %}"></script>
</head>
<body class="bg-body text-body">

    <!-- Cabecera con botón de cambio de tema -->
        <header class="d-flex justify-content-between align-items-center p-3 border-bottom">
            <h1 class="h4 m-0">🎮 Tienda de Videojuegos</h1>
            <button id="toggle-theme" class="btn btn-outline-secondary rounded-circle shadow-sm d-flex align-items-center justify-content-center" style="width: 45px; height: 45px; transition: all 0.3s ease;">
                <i class="fa-solid fa-circle-half-stroke"></i>
            </button>
        </header>

    {% block content %}
    <!-- Aquí irá el contenido específico de cada página -->
    {% endblock %}

    <footer class="text-center mt-5 mb-3">
        <p>&copy; 2025 Tienda de Videojuegos</p>
        <a href="{% url 'home' %}" class="text-body">Inicio</a>
        <a href="{% url 'contacto' %}" class="text-body ms-3">Contacto</a>
    </footer>

</body>
</html>
